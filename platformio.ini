; =====================================================================
;  Fahrzeuge antippen  -  Kleinkind-Spiel fuer das
;  Freenove ESP32-S3-WROOM Board mit 2.8" Touch-Screen (ST7789 + FT6336U)
;  und I2S-Lautsprecher (Shield).
;
;  Autos fahren langsam ueber den Bildschirm. Tippt das Kind ein
;  Fahrzeug an, hupt es / macht Motorgeraeusche und blinkt.
; =====================================================================

[env:freenove_esp32_s3]
platform  = espressif32@6.9.0        ; Arduino-ESP32 Core 2.0.17 (stabile I2S-Legacy-API)
board     = esp32-s3-devkitc-1        ; passt zum Freenove ESP32-S3-WROOM
framework = arduino

board_build.f_cpu   = 240000000L
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; FT6336U liegt lokal in lib/FT6336U (identisch zum Freenove-Kit)

build_flags =
    ; ---------- TFT_eSPI komplett ueber Build-Flags konfigurieren ----------
    ; (entspricht Freenoves "FNK0086A_2P8_CFG1_240x320_ST7789")
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=20
    -D TFT_SCLK=21
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=80000000
    -D USE_HSPI_PORT=1
    ; Falls die Farben "negativ"/vertauscht aussehen (Freenove CFG2),
    ; die naechste Zeile einkommentieren:
    ; -D TFT_INVERSION_ON=1
